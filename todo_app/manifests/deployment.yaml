apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-persistent-storage
          persistentVolumeClaim:
            claimName: todo-pvc
      containers:
        - name: todo-app
          image: edgz082002/todo-app:v5
          env:
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: todo-persistent-storage
              mountPath: /usr/src/app/files