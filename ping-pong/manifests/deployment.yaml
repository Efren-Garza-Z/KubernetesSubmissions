apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: edgz082002/ping-pong:v2
          volumeMounts:
            - name: persistent-storage
              mountPath: /usr/src/app/shared
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: shared-pvc
