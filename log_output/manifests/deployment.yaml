apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: shared-pvc
      containers:
        - name: log-writer
          image: edgz082002/log-writer:v1
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
        - name: log-reader
          image: edgz082002/log-reader:v3
          volumeMounts:
            - name: shared-logs
              mountPath: /usr/src/app/files
            - name: persistent-storage
              mountPath: /usr/src/app/shared